name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src)
        run: npm run typecheck

      # Build before the examples typecheck: examples import the package by
      # name (`@p2pdotme/widgets`), which resolves through `exports` to
      # `dist/*.d.ts`. Without a prior build those declarations don't exist
      # in a fresh `npm ci` checkout and the examples typecheck fails.
      - name: Build
        run: npm run build

      - name: Typecheck (examples)
        run: npm run typecheck:examples

      - name: Test
        run: npm run test
